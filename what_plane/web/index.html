<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="what plane" />
    <title>what plane</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">ADS-B lookup</p>
        <h1>what plane</h1>
      </header>

      <p class="status" id="status">Tap locate to find the nearest aircraft.</p>

      <section class="card hidden" id="result" aria-live="polite">
        <p class="summary" id="summary"></p>
        <div class="compass fallback" id="compass" aria-hidden="true">
          <div class="compass-ring">
            <span>N</span><span>E</span><span>S</span><span>W</span>
          </div>
          <div class="needle" id="needle"></div>
          <div class="cdi" id="cdi">
            <span class="cdi-dot"></span>
            <span class="cdi-dot"></span>
            <span class="cdi-dot"></span>
            <span class="cdi-dot"></span>
            <span class="cdi-dot"></span>
            <span class="cdi-dot"></span>
            <span class="cdi-dot"></span>
            <span class="cdi-dot"></span>
            <div class="cdi-bar gs" id="gs"></div>
            <div class="cdi-bar loc" id="loc"></div>
            <div class="cdi-center" id="cdi-center"></div>
          </div>
        </div>
        <p class="bearing hidden" id="bearing"></p>
        <dl class="details" id="details"></dl>
      </section>

      <div class="actions">
        <button class="btn primary" id="locate" type="button">Locate &amp; scan</button>
        <button class="btn hidden" id="refresh" type="button">Refresh</button>
        <button class="btn hidden" id="compass-btn" type="button">Enable pointing</button>
      </div>

      <p class="footnote">Nearest by distance — not necessarily the one you are looking at.</p>
    </main>
    <script src="/pointer.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
