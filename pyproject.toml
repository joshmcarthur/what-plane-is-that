[project]
name = "what-plane"
version = "0.3.0"
description = "Return the nearest aircraft to a lat/lng using ADS-B Exchange."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.53.0",
    "zstandard==0.25.0",
]

[project.scripts]
what-plane = "what_plane.main:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["what_plane"]

[tool.hatch.build.targets.wheel.force-include]
"what_plane/web" = "what_plane/web"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["what_plane"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["what_plane", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["what_plane", "tests"]
reportMissingParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
