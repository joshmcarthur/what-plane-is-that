name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest --cov=what_plane --cov-report=term-missing --cov-fail-under=95

  garmin:
    name: Compile Connect IQ app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Connect IQ SDK and devices
        uses: actions/cache@v4
        with:
          path: |
            ~/.ciq/sdk
            ~/.Garmin/ConnectIQ/Devices
          key: connectiq-sdk-9.2.0-devices-1

      - name: Install Connect IQ SDK
        env:
          SDK_ZIP: connectiq-sdk-lin-9.2.0-2026-06-09-92a1605b2.zip
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.ciq/sdk/bin/monkeybrains.jar" ]; then
            mkdir -p "$HOME/.ciq/sdk"
            curl -fsSL -o /tmp/ciq-sdk.zip \
              "https://developer.garmin.com/downloads/connect-iq/sdks/${SDK_ZIP}"
            unzip -q /tmp/ciq-sdk.zip -d "$HOME/.ciq/sdk"
          fi
          if [ ! -d "$HOME/.Garmin/ConnectIQ/Devices/fenix7" ]; then
            mkdir -p "$HOME/.Garmin/ConnectIQ/Devices"
            curl -fsSL -L -o /tmp/ciq-devices.tar.gz \
              "https://github.com/blackshadev/garmin-connectiq-tools/raw/main/devices.tar.gz"
            tar -xzf /tmp/ciq-devices.tar.gz -C "$HOME/.Garmin/ConnectIQ/Devices" ./fenix7
          fi
          test -f "$HOME/.ciq/sdk/bin/monkeybrains.jar"
          test -f "$HOME/.Garmin/ConnectIQ/Devices/fenix7/compiler.json"

      - name: Compile watch app
        run: |
          set -euo pipefail
          openssl genrsa -out /tmp/developer_key.pem 2048
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in /tmp/developer_key.pem -out /tmp/developer_key.der -nocrypt
          mkdir -p garmin/bin
          java -Xms1g -Dfile.encoding=UTF-8 \
            -jar "$HOME/.ciq/sdk/bin/monkeybrains.jar" \
            -f garmin/monkey.jungle \
            -d fenix7 \
            -o garmin/bin/what-plane.prg \
            -y /tmp/developer_key.der \
            -w
          test -s garmin/bin/what-plane.prg

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
